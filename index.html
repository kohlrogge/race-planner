<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>100 Miler Pace Chart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: full-width brand bands like the website (teal header, light grey spacer), then a centered working column with purple and black section bars, black-capped cards and a black-headed table.
   Single light look by design, matching thewomens100milerproject.com: teal #0F485A, purple #361269, mint #B5DDD4, light grey #C4D3D5, black, white. */
:root{
  --teal:#0f485a; --purple:#361269; --mint:#b5ddd4; --grey:#c4d3d5; --black:#000000; --white:#ffffff;
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#4a5a60; --line:#c4d3d5; --row:#eef3f4;
  --accent:#0f485a; --accent-ink:#ffffff; --accent-soft:#e6f2ef;
  --cut:#c62828; --cut-soft:#fdeaea; --warn:#a15c00; --ok:#1f7a48; --adj:#8a5300; --adjbg:#fff1d6;
  --display:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
  --label:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:clip}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.bleed{width:100vw;margin-left:calc(50% - 50vw)}
.bleed-inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.2rem;color:var(--white);text-shadow:0 0 12px rgba(255,255,255,.35)}
h2{font-size:1.5rem;color:var(--ink)}
.eyebrow{font-family:var(--label);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

/* brand header band */
.top{background:var(--teal);color:var(--white)}
.top .bleed-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:22px}
.top .eyebrow{color:rgba(255,255,255,.8)}
.top .muted{color:rgba(255,255,255,.85)}
.greyband{background:var(--grey);height:22px;margin-bottom:4px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.brand img{width:72px;height:72px;flex:none;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.brand .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--black);background:var(--white);color:var(--black);border-radius:8px;padding:7px 14px;font-family:var(--label);font-weight:600;font-size:.9rem}
.btn:hover{background:var(--row)}
.btn.primary{background:var(--purple);color:var(--white);border-color:var(--purple)}
.btn.primary:hover{background:#4a1d8a}
.btn.ghost{background:transparent}
.top .btn{border-color:var(--white);background:transparent;color:var(--white)}
.top .btn:hover{background:rgba(255,255,255,.12)}
.top .btn.primary{background:var(--white);color:var(--teal)}
.top .btn.primary:hover{background:var(--mint)}
.btn[disabled]{opacity:.4;cursor:default}

/* section bars */
.bar{font-family:var(--display);font-weight:700;font-size:1.5rem;text-align:center;color:var(--white);padding:10px 16px;border-radius:0}
.bar.purple{background:var(--purple)}
.bar.black{background:var(--black);font-weight:500;text-shadow:0 0 10px rgba(255,255,255,.4)}

.banner{background:var(--grey);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.banner p{margin:0;max-width:75ch}

.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--black);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:transparent;padding:6px 14px;font-family:var(--label);font-weight:600;font-size:.85rem;color:var(--black)}
.seg button+button{border-left:2px solid var(--black)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--white)}
.seg.small{border-color:var(--white);background:transparent}
.seg.small button{padding:3px 9px;font-size:.75rem;color:var(--white)}
.seg.small button+button{border-left-color:var(--white)}
.seg.small button[aria-pressed="true"]{background:var(--white);color:var(--black)}

/* plan cards: black cap like the exercise cards */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--grey);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card > .row:first-child{background:var(--black);color:var(--white);margin:0 -16px 4px;padding:10px 16px;min-height:50px;box-sizing:border-box}
.card > .row:first-child .eyebrow{color:var(--white);font-size:.95rem;letter-spacing:.02em;text-transform:none;font-weight:700}
.card .big{color:var(--ink);font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card.plain{padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;align-self:flex-start}
.chip.ok{color:var(--white);background:var(--ok)}
.chip.bad{color:var(--white);background:var(--cut)}
.card p{margin:0;font-size:.9rem}

/* course strip */
.strip{padding:6px 0}
.strip svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:4px;height:14px;vertical-align:-3px;margin-right:6px}

/* table */
.tablebox{border:1px solid var(--grey);border-radius:14px;overflow-x:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;vertical-align:middle;border-bottom:1px solid #dde6e8;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
thead th{font-family:var(--label);font-weight:500;font-size:.8rem;color:rgba(255,255,255,.8);background:var(--black)}
thead th .hl{display:block;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--white)}
tbody tr:nth-child(even) td{background:var(--row)}
tbody tr:last-child td{border-bottom:0}
td .t{font-weight:700;font-size:1rem}
td.cutcol .t.hard{color:var(--cut)}
td.cutcol .t.est{color:var(--muted);font-weight:400}
td .day{font-size:.72rem;color:var(--muted);font-weight:700;margin-right:4px}
td.miss{box-shadow:inset 4px 0 0 var(--cut)}
tbody tr td.adj{background:var(--adjbg)}
td.adj .t{color:var(--adj)}
.adjkey{display:inline-block;width:18px;height:12px;border-radius:2px;background:#f6d48f;vertical-align:-1px;margin-right:6px}
.chip.adj{color:var(--black);background:var(--adjbg);border:1px solid var(--adj)}
.seg button[disabled]{color:#9aa7ab;cursor:not-allowed}
.stn{font-weight:700}
.stn small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}

.foot{font-size:.84rem;color:var(--muted);max-width:80ch;margin:0 auto;text-align:center}
.copyfall{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem}

/* wizard */
.wiz{border:1px solid var(--grey);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px;font-family:var(--label);font-weight:600;font-size:.85rem;color:var(--muted);padding:4px 12px 4px 4px;border-radius:999px;background:var(--row)}
.steps li b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--white);border:2px solid var(--grey);font-size:.8rem;color:var(--ink)}
.steps li.on{color:var(--white);background:var(--purple)}
.steps li.on b{background:var(--white);border-color:var(--white);color:var(--purple)}
.steps li.done b{background:var(--teal);border-color:var(--teal);color:var(--white)}
.field{display:flex;flex-direction:column;gap:6px;max-width:420px}
.field label,.flabel{font-family:var(--label);font-weight:600;font-size:.9rem}
.field .help{font-size:.84rem;color:var(--muted)}
.in{box-sizing:border-box;border:2px solid var(--grey);background:var(--white);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.in:focus{border-color:var(--teal);outline:none}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;max-width:640px}
.choice{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--grey);border-radius:10px;padding:12px;cursor:pointer;background:var(--white)}
.choice:has(input:checked){border-color:var(--teal);background:var(--accent-soft)}
.choice input{margin-top:3px;accent-color:var(--teal)}
.choice span{display:flex;flex-direction:column;gap:2px}
.choice small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:700px}
.stbox{overflow-x:auto}
.sttable{min-width:560px}
.sttable.plantable{min-width:0;max-width:640px}
.sttable td,.sttable th{padding:6px;text-align:left;border-bottom:1px solid #dde6e8;background:transparent!important}
.sttable thead th{background:transparent;color:var(--muted);font-weight:600}
.sttable td.idx{color:var(--muted);width:24px;text-align:right}
.sttable td:first-child,.sttable th:first-child{min-width:0;width:24px}
.sttable td,.sttable th{padding:6px 8px}
.sttable .note{display:block;padding-left:12px;color:var(--muted);font-size:.85rem;white-space:nowrap}
.sttable .in{padding:6px 8px}
.rm{border:0;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px 8px;border-radius:6px}
.rm:hover{color:var(--cut);background:var(--cut-soft)}
.err{background:var(--cut-soft);color:var(--cut);border-radius:8px;padding:10px 14px;font-size:.9rem;margin:0;font-weight:600}
.wizfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--grey);padding-top:16px}

details.paste{border:2px dashed var(--grey);border-radius:10px;padding:10px 14px}
details.paste summary{cursor:pointer;font-family:var(--label);font-weight:600;font-size:.9rem}
details.paste textarea{width:100%;min-height:110px;margin-top:8px;font-family:ui-monospace,monospace;font-size:.82rem}
.preview{font-size:.9rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.choice{transition:background-color .15s,border-color .15s}}
</style>
</head>

// Older saved charts had exactly two goals stored as goal/mid; convert them to the plan list.
function normalize(c){
  if(!c) return c;
  if(!Array.isArray(c.plans)){
    const L=c.labels||{}; c.plans=[];
    if(c.goal!=null) c.plans.push({label:L.goal||'Goal',time:c.goal});
    if(c.mid!=null) c.plans.push({label:L.mid||'B Goal',time:c.mid});
  }
  c.labels={cut:(c.labels&&c.labels.cut)||'Cutoff'};
  delete c.goal; delete c.mid;
  return c;
}

  const head=[['Aid station',uLabel()].concat(seg?['Segment']:[]).concat(chart.plans.map(p=>p.label+'\n'+fmtDur(p.time))).concat([chart.labels.cut+'\n'+fmtDur(chart.total)])];
  const body=R.rows.map((r,i)=>[r.name+(r.first?'  (start)':r.last?'  (finish)':''),dShow(r.dist).toFixed(1)].concat(seg?[r.first?'':dShow(r.seg).toFixed(1)]:[])
    .concat(R.plans.map(p=>showTimePlain(p.times[i]))).concat([showTimePlain(r.cut)]));
  const nCols=head[0].length, cutCol=nCols-1, firstPlan=cutCol-R.plans.length;
  const colStyles={0:{halign:'left',fontStyle:'bold'}}; for(let c=1;c<nCols;c++) colStyles[c]={halign:'right'};
  doc.autoTable({
    startY:y+48, head, body, theme:'plain', margin:{left:M,right:M},
    styles:{font:'helvetica',fontSize:9.5,cellPadding:{top:4.5,bottom:4.5,left:6,right:6},textColor:[17,17,17],lineColor:[221,230,232],lineWidth:{bottom:0.5}},
    headStyles:{fillColor:[0,0,0],textColor:[255,255,255],fontStyle:'bold',fontSize:9},
    alternateRowStyles:{fillColor:[238,243,244]},
    columnStyles:colStyles,
    didParseCell:(d)=>{
      if(d.section==='head'){ if(d.column.index>0) d.cell.styles.halign='right'; if(d.column.index===cutCol) d.cell.styles.textColor=[255,138,128]; return; }
      const i=d.row.index, r=R.rows[i], c=d.column.index;
      if(c>=firstPlan && c<cutCol){ d.cell.styles.fontStyle='bold';
        const p=R.plans[c-firstPlan]; if(p.pinned.has(i)){ d.cell.styles.fillColor=[255,241,214]; d.cell.styles.textColor=[138,83,0]; } }
      if(c===cutCol && !r.first){ if(r.hard){ d.cell.styles.textColor=[198,40,40]; d.cell.styles.fontStyle='bold'; } else d.cell.styles.textColor=[110,124,130]; }
      if(seg && c===2) d.cell.styles.textColor=[110,124,130];
    }
  });
  let fy=doc.lastAutoTable.finalY+16;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,104,110);
  const note='Red cutoff times are posted by the race; grey cutoff times are estimated from the overall cutoff. Shaded plan times were moved earlier so the runner arrives at least '+R.margin+' minutes before that posted cutoff; pace between those points stays even.'+
    (chart.display==='clock'?' Times are time of day.':' Times are elapsed race time (hours:minutes).');
  const lines=doc.splitTextToSize(note,W-2*M);
  if(fy+lines.length*10>doc.internal.pageSize.getHeight()-24){ doc.addPage(); fy=48; }
  doc.text(lines,M,fy);
  return doc;
}
function pdfName(){return ((chart.name||'pace chart').replace(/[^A-Za-z0-9 ._-]+/g,'').trim().replace(/\s+/g,'-')||'pace-chart')+'-pace-chart.pdf'}
async function savePdf(){
  if(pdfBusy) return;
  pdfBusy=true; pdfMsg=''; render();
  try{
    let jsPDF;
    try{ jsPDF=await ensurePdfLib(); }catch(e){ pdfMsg='The PDF tool couldn\'t load. Check your internet connection and try again.'; return; }
    const doc=buildPdf(jsPDF), name=pdfName();
    // Inside Claude the page runs in a protected frame: a normal browser download is blocked there and replaces the
    // app with an error page, so only Claude's own save prompt is used. On a regular website (GitHub Pages,
    // Squarespace) there is no window.claude and the browser download works.
    const inClaude=!!(window.claude&&window.claude.use);
    if(!inClaude){ doc.save(name); return; }
    const noSave='This Claude view can\'t save files. Open the app on claude.ai in a web browser, or use the version on your website, to save the PDF.';
    let dl=null;
    try{ dl=await window.claude.use('downloads'); }catch(e){}
    if(!dl){ pdfMsg=noSave; return; }
    try{ await dl.save({filename:name,data:doc.output('blob')}); }
    catch(e){

      if(c==='declined') return;
      pdfMsg = c==='rate_limited' ? 'A save prompt is already open. Finish or close it, then try again.' : noSave;
    }
  } finally { pdfBusy=false; render(); }
}


function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chart))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad = n => String(n).padStart(2,'0');

/* ---------- time helpers ---------- */
function fmtDur(min){const m=Math.round(min);const s=m<0?'-':'';const a=Math.abs(m);return s+Math.floor(a/60)+':'+pad(a%60)}
function parseDur(str){
  str=String(str||'').trim(); if(!str) return null;
  let m=str.match(/^(\d{1,3})(?::(\d{1,2}))?$/); if(!m) return NaN;
  const mm = m[2]===undefined?0:+m[2]; if(mm>59) return NaN;
  return (+m[1])*60+mm;
}
function parseClock(str){
  str=String(str||'').trim().toLowerCase().replace(/\./g,''); if(!str) return null;
  let m=str.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/); if(!m) return NaN;
  let h=+m[1], mm=m[2]===undefined?0:+m[2]; const ap=m[3];
  if(mm>59) return NaN;
  if(ap){ if(h<1||h>12) return NaN; if(ap[0]==='p'&&h!==12) h+=12; if(ap[0]==='a'&&h===12) h=0; }
  else if(h>23) return NaN;
  return h*60+mm;
}
function fmtClock12(tod){tod=((Math.round(tod)%1440)+1440)%1440;const h=Math.floor(tod/60),m=tod%60;const ap=h<12?'AM':'PM';const h12=h%12===0?12:h%12;return h12+':'+pad(m)+' '+ap}
function fmtTime24(tod){return pad(Math.floor(tod/60))+':'+pad(tod%60)}
function dayLabel(dayIdx){
  if(chart.startDate){
    const d=new Date(chart.startDate+'T12:00:00'); if(!isNaN(d)){d.setDate(d.getDate()+dayIdx);return d.toLocaleDateString('en-US',{weekday:'short'})}
  }
  return 'Day '+(dayIdx+1);
}
function clockParts(elapsed){const tot=chart.startTime+Math.round(elapsed);return {day:Math.floor(tot/1440),text:fmtClock12(tot%1440)}}
function showTime(elapsed){
  if(chart.display==='clock'){const c=clockParts(elapsed);return '<span class="day">'+esc(dayLabel(c.day))+'</span>'+c.text}
  return fmtDur(elapsed);
}
function showTimePlain(elapsed){
  if(chart.display==='clock'){const c=clockParts(elapsed);return dayLabel(c.day)+' '+c.text}
  return fmtDur(elapsed);
}
function fmtPace(minPerUnit){if(!isFinite(minPerUnit))return '';let m=Math.floor(minPerUnit),s=Math.round((minPerUnit-m)*60);if(s===60){m++;s=0}return m+':'+pad(s)}
const uLabel = () => chart.unit==='km'?'km':'mi';
const dShow = mi => chart.unit==='km'?mi*KM:mi;
const paceOf = (min,mi) => chart.unit==='km'? min/(mi*KM) : min/mi;

/* ---------- calculation ---------- */
function marginOf(c){return (c.margin==null||isNaN(c.margin))?15:c.margin}
// Validation shared by setup and the chart's margin buttons. Returns '' when the margin works.
function marginIssue(m,stations,plans,total){
  if(!Number.isInteger(m)||m<0||m>120) return 'Enter the cutoff margin as whole minutes from 0 to 120.';
  const first=stations.slice(1,-1).find(s=>s.cutoff!=null);
  if(first && m>=first.cutoff) return 'A '+m+' minute margin is longer than the time to the first cutoff ('+esc(first.name)+' at '+fmtDur(first.cutoff)+'). Use less than '+first.cutoff+' minutes.';
  for(const p of plans){
    if(p.time>total-m) return 'Your '+esc(p.label)+' time ('+fmtDur(p.time)+') finishes less than '+m+' minutes before the overall cutoff. Make it '+fmtDur(total-m)+' or faster, or use a smaller margin.';
  }
  return '';
}
function compute(c){
  const st=c.stations, last=st.length-1, D=st[last].dist, T=c.total;
  const rows=st.map((s,i)=>{
    let hard=false,cut;
    if(i===0){cut=0}
    else if(i===last){cut=T;hard=true}
    else if(s.cutoff!=null){cut=s.cutoff;hard=true}
    else cut=T*s.dist/D;
    return {name:s.name,dist:s.dist,seg:i?s.dist-st[i-1].dist:0,cut,hard,first:i===0,last:i===last};
  });
  const M = marginOf(c);
  function plan(target){
    // Even pace between anchors. Start at 0 and the finish at the target are anchors; any posted cutoff the plan
    // would reach later than (cutoff - margin) becomes an anchor at exactly (cutoff - margin). Repeat until none.
    const anchors=[{i:0,d:0,t:0},{i:rows.length-1,d:D,t:target}];
    const pinned=new Set();
    const interp=()=>rows.map(r=>{
      let k=0; while(k<anchors.length-2 && anchors[k+1].d<r.dist) k++;
      const a=anchors[k],b=anchors[k+1]; return a.t+(b.t-a.t)*(r.dist-a.d)/(b.d-a.d);
    });
    let times=interp();
    for(let guard=0; guard<rows.length; guard++){
      let worst=null;
      rows.forEach((r,i)=>{ if(!r.hard||r.first||r.last||pinned.has(i))return;
        const over=times[i]-(r.cut-M); if(over>0.01&&(!worst||over>worst.over)) worst={i,over}; });
      if(!worst) break;
      pinned.add(worst.i);
      anchors.push({i:worst.i,d:rows[worst.i].dist,t:rows[worst.i].cut-M});
      anchors.sort((x,y)=>x.d-y.d);
      times=interp();
    }
    let misses=[], tight=null;
    rows.forEach((r,i)=>{ if(!r.hard||r.first)return; const b=r.cut-times[i];
      if(b<-0.5) misses.push({i,b}); else if(!tight||b<tight.b) tight={i,b}; });
    return {target,times,misses,tight,pinned};
  }
  let limit=Infinity, limitAt=null;
  rows.forEach((r,i)=>{ if(r.hard&&r.dist>0){const f=r.cut/r.dist*D; if(f<limit){limit=f;limitAt=i}} });
  return {rows,D,T,plans:c.plans.map(p=>Object.assign(plan(p.time),{label:p.label})),margin:M,limit,limitAt,hardCount:rows.filter(r=>r.hard).length};
}

function marginBtns(){

    const bad=marginIssue(v,chart.stations,chart.plans,chart.total);

  }).join('')+'</div>';
}

function planCard(p,R){
  const lbl=p.label;
  let status;
  const n=p.pinned.size;
  if(p.misses.length){
    const f=R.rows[p.misses[0].i].name;
    status='<span class="chip bad">Misses '+p.misses.length+' cutoff'+(p.misses.length>1?'s':'')+'</span>';
    status+='<p>First miss: <b>'+esc(f)+'</b>, '+fmtDur(-p.misses[0].b)+' late.</p>';
  } else {
    status='<span class="chip ok">Clears all '+R.hardCount+' hard cutoffs</span>';
    if(n) status+='<p><span class="adjkey"></span>Sped up to arrive '+R.margin+' min before the cutoff at <b>'+n+'</b> station'+(n>1?'s':'')+', then eased off after to still finish in '+fmtDur(p.target)+'.</p>';
    else status+='<p>Even pace the whole way. Closest call: <b>'+esc(R.rows[p.tight.i].name)+'</b>, '+fmtDur(p.tight.b)+' ahead of the cutoff.</p>';
  }
  const avg=fmtPace(paceOf(p.target,R.D));
  return '<div class="card"><div class="row"><span class="eyebrow">'+esc(lbl)+'</span>'+(n?'<span class="chip adj">Adjusted at '+n+'</span>':'')+'</div>'+
    '<div class="row"><span class="big num">'+fmtDur(p.target)+'</span><span class="muted num">'+avg+' /'+uLabel()+' avg</span></div>'+
    (chart.display==='clock'?'<p class="muted num">Finish '+esc(showTimePlain(p.target))+'</p>':'')+
    status+'</div>';
}

function cutCard(R){
  const lim = R.limitAt!=null && isFinite(R.limit);
  return '<div class="card cutcard"><div class="row"><span class="eyebrow">'+esc(chart.labels.cut)+'</span><span class="muted" style="font-size:.8rem">'+R.hardCount+' hard, '+(R.rows.length-1-R.hardCount)+' estimated</span></div>'+
    '<div class="row"><span class="big num" style="color:var(--cut)">'+fmtDur(R.T)+'</span><span class="muted num">'+fmtPace(paceOf(R.T,R.D))+' /'+uLabel()+' avg</span></div>'+
    (lim?'<p>Slowest <b>even</b> pace that clears every cutoff: <b class="num">'+fmtPace(paceOf(R.limit,R.D))+' /'+uLabel()+'</b>, a <b class="num">'+fmtDur(R.limit)+'</b> finish. The binding cutoff is <b>'+esc(R.rows[R.limitAt].name)+'</b>.</p>':'')+
    '</div>';
}

function strip(R){

}

}

function startMin(){const v=parseClock(wiz.startText);return (v==null||isNaN(v))?NaN:v}

function buildStations(syntaxOnly){
  // returns {stations} or {err}. syntaxOnly: check clock cutoffs' format without converting (start time not known yet)
  const rows=wiz.rows, out=[]; let prevD=-1, prevCut=0;
  const sm=startMin();
  for(let i=0;i<rows.length;i++){
    const r=rows[i], name=r.name.trim()||(i===0?'Start':i===rows.length-1?'Finish':'');
    if(!name) return {err:'Aid station '+i+' needs a name.'};
    let d = i===0?0:parseFloat(r.distText);
    if(isNaN(d)) return {err:name+' needs a distance.'};
    if(d<=prevD) return {err:name+' must be farther than the station before it.'};
    prevD=d;
    let cut=null;
    if(i>0 && i<rows.length-1 && r.cutText.trim()){
      if(wiz.cutoffFormat==='clock'){
        const c=parseClock(r.cutText); if(c==null||isNaN(c)) return {err:'The cutoff for '+name+' should look like 6:00 PM or 18:00.'};
        if(syntaxOnly){cut=1; out.push({name,dist:d,cutoff:cut}); continue}
        if(isNaN(sm)) return {err:'Add a valid start time in step 2 so time-of-day cutoffs can be converted.'};
        let e=((c-sm)%1440+1440)%1440; while(e<=prevCut) e+=1440; cut=e;
      } else {
        const c=parseDur(r.cutText); if(c==null||isNaN(c)) return {err:'The cutoff for '+name+' should be hours:minutes of race time, like 14:25.'};
        if(c<=prevCut) return {err:'The cutoff for '+name+' has to be later than the cutoff before it.'};
        cut=c;
      }
      prevCut=cut;
    }
    out.push({name,dist:wiz.entryUnit==='km'?d/KM:d,cutoff:cut});
  }
  if(out.length<2) return {err:'Add at least a start and a finish.'};
  return {stations:out,lastCut:prevCut};
}

function validateStep(){
  readWizInputs();
  if(wiz.step===1){const b=buildStations(true); if(b.err) return b.err}
  if(wiz.step===2){
    if(!wiz.name.trim()) return 'Give the race a name.';
    const s=startMin(); if(isNaN(s)) return 'Enter a start time like 6:00 AM or 06:00.';
    const b=buildStations(); if(b.err) return b.err;
  }
  if(wiz.step===3){
    if(!wiz.plans.length) return 'Add at least one goal time.';
    const seenL=new Set(), seenT=new Map(), plans=[];
    for(let i=0;i<wiz.plans.length;i++){
      const lab=wiz.plans[i].label.trim();
      if(!lab) return 'Give goal '+(i+1)+' a column name.';
      if(seenL.has(lab.toLowerCase())) return 'Two goals are both named "'+lab+'". Give each one a different name.';
      seenL.add(lab.toLowerCase());
      const tm=parseDur(wiz.plans[i].timeText);
      if(tm==null||isNaN(tm)||tm<=0) return 'Enter the '+lab+' time as hours:minutes, like 28:00.';
      if(seenT.has(tm)) return lab+' and '+seenT.get(tm)+' have the same time ('+fmtDur(tm)+'). Change one of them or remove it.';
      seenT.set(tm,lab); plans.push({label:lab,time:tm});
    }
    const t=parseDur(wiz.totalText);
    if(t==null||isNaN(t)) return 'Enter the overall cutoff as hours:minutes, like 34:00.';
    for(const p of plans) if(p.time>=t) return 'The '+p.label+' time ('+fmtDur(p.time)+') has to be faster than the overall cutoff ('+fmtDur(t)+').';
    const b=buildStations(); if(b.err) return b.err;
    if(b.lastCut>=t) return 'The overall cutoff has to be later than the last aid station cutoff ('+fmtDur(b.lastCut)+').';
    const mt=wiz.marginText.trim();
    if(!/^\d+$/.test(mt)) return 'Enter the cutoff margin as whole minutes from 0 to 120.';
    const mi=marginIssue(+mt,b.stations,plans,t); if(mi) return mi.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  }
  return '';
}

function finishWizard(){
  const b=buildStations();
  chart={isExample:false,name:wiz.name.trim(),unit:wiz.entryUnit,entryUnit:wiz.entryUnit,display:wiz.display,detail:wiz.detail,
    startDate:wiz.startDate,startTime:startMin(),cutoffFormat:wiz.cutoffFormat,labels:wiz.labels,
    plans:wiz.plans.map(p=>({label:p.label.trim(),time:parseDur(p.timeText)})).sort((a,b)=>a.time-b.time),total:parseDur(wiz.totalText),margin:+wiz.marginText.trim(),stations:b.stations};
  save(); view='chart'; wiz=null; render(); window.scrollTo(0,0);
}

function radio(name,val,cur,title,help){
  return '<label class="choice"><input type="radio" name="'+name+'" value="'+val+'"'+(cur===val?' checked':'')+'><span><b>'+title+'</b><small>'+help+'</small></span></label>';
}

function renderWizard(){
  const w=wiz, steps=['Aid stations','Race details','Target times'];
  let h='<header class="top bleed"><div class="bleed-inner"><div class="brand">'+LOGO+'<div class="title"><span class="eyebrow">Women\'s 100 Miler Project pace chart</span><h1>'+(w.editing?'Edit chart':'New pace chart')+'</h1></div></div>'+
        '<div class="actions">'+(chart?'<button class="btn ghost" data-act="cancel" type="button">Cancel</button>':'')+'</div></div></header><div class="greyband bleed"></div>';
  h+='<div class="wiz" id="wizform"><ol class="steps">'+steps.map((s,i)=>'<li class="'+(w.step===i+1?'on':w.step>i+1?'done':'')+'"><b>'+(i+1)+'</b>'+s+'</li>').join('')+'</ol>';
  if(w.step===1){
    const u=w.entryUnit==='km'?'km':'mi';
    h+='<div><h2>Enter your aid stations</h2><p class="preview" style="margin-top:6px;max-width:70ch">List every aid station in order with its distance from the start. Fill in a cutoff only where the race posts one; leave it blank and the chart estimates it from the overall cutoff. The finish cutoff is the overall cutoff, which you enter in step 3.</p></div>';
    h+='<div class="grid2" style="max-width:none">'+
       '<div class="field" style="max-width:none"><span class="flabel">Distances are in</span><span class="help">You can switch the chart between miles and kilometers later.</span><div class="choices">'+radio('w-unit','mi',w.entryUnit,'Miles','')+radio('w-unit','km',w.entryUnit,'Kilometers','')+'</div></div>'+
       '<div class="field" style="max-width:none"><span class="flabel">The race posts cutoffs as</span><span class="help">Clock times are converted using the start time in step 2.</span><div class="choices">'+radio('w-cf','elapsed',w.cutoffFormat,'Race time','e.g. 14:25')+radio('w-cf','clock',w.cutoffFormat,'Time of day','e.g. 8:25 PM')+'</div></div>'+
       '</div>';
    h+='<div class="stbox"><table class="sttable"><thead><tr><th></th><th>Name</th><th>Distance ('+u+')</th><th>Hard cutoff</th><th></th></tr></thead><tbody>';
    w.rows.forEach((r,i)=>{
      const first=i===0,last=i===w.rows.length-1;
      h+='<tr><td class="idx num">'+(first?'S':last?'F':i)+'</td>'+
         '<td><input class="in" id="w-n'+i+'" value="'+esc(r.name)+'" placeholder="'+(first?'Start':last?'Finish':'Aid station name')+'"></td>'+
         '<td><input class="in num" id="w-d'+i+'" inputmode="decimal" value="'+(first?'0':esc(r.distText))+'"'+(first?' readonly':'')+' placeholder="0.0"></td>'+
         '<td>'+(first||last?'<span class="note">'+(first?'None':'Set in step 3')+'</span>':'<input class="in num" id="w-c'+i+'" value="'+esc(r.cutText)+'" placeholder="Optional">')+'</td>'+
         '<td>'+(first||last?'':'<button type="button" class="rm" data-act="rmrow" data-i="'+i+'" aria-label="Remove '+esc(r.name||'row')+'">×</button>')+'</td></tr>';
    });
    h+='</tbody></table></div><div><button type="button" class="btn" data-act="addrow">Add aid station</button></div>';
    h+='<details class="paste"><summary>Paste rows from a spreadsheet</summary><p class="preview">One station per line: name, distance, cutoff (optional), separated by tabs or commas. The first line is the start and the last line is the finish. This replaces the rows above.</p><textarea id="w-paste" class="in" placeholder="Group Camp	0&#10;Pickett	6.8&#10;Charit	19.2	6:00"></textarea><div style="margin-top:8px"><button type="button" class="btn" data-act="paste">Use these rows</button></div></details>';
  }
  if(w.step===2){
    h+='<div class="field"><label for="w-name">Race name</label><input class="in" id="w-name" value="'+esc(w.name)+'" placeholder="e.g. Big Fork 100" autocomplete="off"></div>';
    h+='<div class="grid2"><div class="field"><label for="w-start">Start time</label><input class="in" id="w-start" value="'+esc(w.startText)+'" placeholder="6:00 AM"><span class="help">Needed for time-of-day display and for cutoffs posted as clock times.</span></div>'+
       '<div class="field"><label for="w-date">Race date (optional)</label><input class="in" type="date" id="w-date" value="'+esc(w.startDate)+'"><span class="help">Adds weekday labels like Sat and Sun to clock times.</span></div></div>';
    h+='<div class="field" style="max-width:none"><span class="flabel">How should the chart show times?</span><span class="help">You can toggle this later too.</span><div class="choices">'+
       radio('w-disp','elapsed',w.display,'Race time','Hours since the start, e.g. 14:25')+radio('w-disp','clock',w.display,'Time of day','Clock time, e.g. Sat 8:25 PM')+'</div></div>';
  }
  if(w.step===3){
    h+='<div><h2>Goal times</h2><p class="preview" style="margin-top:6px;max-width:70ch">Each goal becomes its own column. Start with the time you are training for, then add backup goals that still finish safely ahead of the cutoffs. Enter times as hours:minutes of race time. Columns are put in order from fastest to slowest.</p></div>';
    h+='<div class="stbox"><table class="sttable plantable"><thead><tr><th></th><th>Column name</th><th>Finish time</th><th></th></tr></thead><tbody>';
    w.plans.forEach((p,i)=>{
      h+='<tr><td class="idx num">'+(i+1)+'</td>'+
         '<td><input class="in" id="w-pl'+i+'" value="'+esc(p.label)+'" placeholder="'+(PLAN_NAMES[i]||'Goal')+'"></td>'+
         '<td><input class="in num" id="w-pt'+i+'" value="'+esc(p.timeText)+'" placeholder="'+['28:00','32:00','33:00','33:30','33:45'][i]+'"></td>'+
         '<td>'+(w.plans.length>1?'<button type="button" class="rm" data-act="rmplan" data-i="'+i+'" aria-label="Remove '+esc(p.label||'goal')+'">×</button>':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="shotrow" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+(w.plans.length<MAX_PLANS?'<button type="button" class="btn" data-act="addplan">Add another goal</button>':'')+
       '<span class="preview">'+w.plans.length+' of '+MAX_PLANS+' goal columns</span></div>';
    h+='<h2 style="margin-top:8px">Cutoff</h2>';
    h+='<div class="grid2">'+
      '<div class="field"><label for="w-total">Overall cutoff</label><input class="in num" id="w-total" value="'+esc(w.totalText)+'" placeholder="34:00"><span class="help">The race\'s finish time limit. Aid stations without a posted cutoff are estimated from this.</span></div>'+
      '<div class="field"><label for="w-lc">Column name</label><input class="in" id="w-lc" value="'+esc(w.labels.cut)+'"></div>'+
      '<div class="field"><label for="w-margin">Cutoff margin (minutes)</label><input class="in num" id="w-margin" inputmode="numeric" value="'+esc(w.marginText)+'" placeholder="15"><span class="help">How far ahead of each posted cutoff the plans must arrive. If even pace would be later than that, the plan speeds up before that station and eases off after. 15 to 30 minutes is common.</span></div>'+
      '</div>';
  }
  if(wizErr) h+='<p class="err" role="alert">'+esc(wizErr)+'</p>';
  h+='<div class="wizfoot"><button type="button" class="btn" data-act="back"'+(w.step===1?' disabled':'')+'>Back</button>'+
     '<button type="button" class="btn primary" data-act="next">'+(w.step===3?'Build pace chart':'Next')+'</button></div></div>';
  return h;
}

function parsePaste(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  lines.forEach(l=>{
    const p=l.includes('\t')?l.split('\t'):l.split(',');
    const cells=p.map(s=>s.trim());
    if(cells.length<2||isNaN(parseFloat(cells[1]))) return; // skip header lines
    rows.push({name:cells[0],distText:cells[1],cutText:cells[2]||''});
  });
  if(rows.length<2) return null;
  if(parseFloat(rows[0].distText)!==0) rows.unshift({name:'Start',distText:'0',cutText:''});
  const last=rows[rows.length-1]; rows[0].cutText='';
  if(last.cutText){ wiz.totalText = last.cutText; last.cutText=''; }
  return rows;
}

/* ---------- render + events ---------- */
const app=document.getElementById('app');
function render(){
  app.innerHTML = view==='chart'?renderChart():renderWizard();
  if(copyText!=null){const t=document.getElementById('copyfall');if(t){t.focus();t.select()}}
}

app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.set){
    const k=b.dataset.set,v=b.dataset.val;
    if(k==='margin') chart.margin=+v; else chart[k]=v;
    save(); render(); return;
  }
  const a=b.dataset.act; if(!a) return;
  if(a==='new'){wiz=newDraft(null);wizErr='';view='wiz';copyText=null;render();window.scrollTo(0,0)}
  if(a==='edit'){wiz=newDraft(chart);wiz.editing=true;wizErr='';view='wiz';copyText=null;render();window.scrollTo(0,0)}
  if(a==='cancel'){view='chart';wiz=null;render()}
  if(a==='example'){wiz=newDraft(EXAMPLE);wizErr='';render()}
  if(a==='back'){readWizInputs();wizErr='';wiz.step--;render()}
  if(a==='addrow'){readWizInputs();wiz.rows.splice(wiz.rows.length-1,0,{name:'',distText:'',cutText:''});render();
    const el=document.getElementById('w-n'+(wiz.rows.length-2)); if(el) el.focus()}
  if(a==='addplan'){readWizInputs(); if(wiz.plans.length<MAX_PLANS){
      const used=new Set(wiz.plans.map(p=>p.label.trim().toLowerCase()));
      const name=PLAN_NAMES.find(n=>!used.has(n.toLowerCase()))||('Goal '+(wiz.plans.length+1));
      wiz.plans.push({label:name,timeText:''}); wizErr=''; render();
      const el=document.getElementById('w-pt'+(wiz.plans.length-1)); if(el) el.focus(); } }
  if(a==='rmplan'){readWizInputs(); if(wiz.plans.length>1){ wiz.plans.splice(+b.dataset.i,1); wizErr=''; render(); } }
  if(a==='rmrow'){readWizInputs();wiz.rows.splice(+b.dataset.i,1);render()}
  if(a==='paste'){readWizInputs();const t=document.getElementById('w-paste').value;const rows=parsePaste(t);
    if(!rows){wizErr='Couldn\'t read those rows. Each line needs a name and a distance.';render();return}
    wiz.rows=rows;wizErr='';render()}
  if(a==='copy'){
    const t=tableTSV();
    try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>{b.textContent='Copy table'},1600)},()=>{copyText=t;render()})}
    catch(err){copyText=t;render()}
  }
  if(a==='closecopy'){copyText=null;render()}
  if(a==='next'){goNext()}
  if(a==='pdf'){savePdf()}
});
app.addEventListener('change',e=>{
  if(view==='wiz' && wiz && wiz.step===1 && (e.target.name==='w-unit'||e.target.name==='w-cf')){readWizInputs();render()}
});
// Next works as a plain button (no form submit), because embedded frames can block form submissions.
function goNext(){
  if(view!=='wiz'||!wiz) return;
  const err=validateStep(); wizErr=err;
  if(err){ render(); const el=document.querySelector('.err'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center'}); return; }
  if(wiz.step<3){ wiz.step++; render(); window.scrollTo(0,0); } else finishWizard();
}
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing) return;
  const t=e.target; if(!(t&&t.tagName==='INPUT'&&t.closest('#wizform'))) return;
  if(t.type==='radio'||t.type==='checkbox') return;
  e.preventDefault(); goNext();
});

// Testing shortcut: opening the link with #demo fills setup with the example race. Not shown to users.
function isDemo(){try{return location.hash==='#demo'}catch(e){return false}}
if(isDemo()){view='wiz';wiz=newDraft(EXAMPLE);}
else if(view==='wiz') wiz=newDraft(null);
try{window.addEventListener('hashchange',()=>{if(isDemo()){view='wiz';wiz=newDraft(EXAMPLE);wizErr='';render()}})}catch(e){}
render();

// expose for testing
window.__pace={compute,parseDur,parseClock,EXAMPLE};
})();
